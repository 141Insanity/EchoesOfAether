function heroStats(i){let ps=S.party[i],b=baseHero(ps.hero),o=heroObj(ps.hero),r=ri(o.rarity),m=RM[o.rarity],lm=1+.035*(ps.level-1);let atk=Math.floor(b.atk*m*lm),def=Math.floor(b.def*m*lm),hp=Math.floor(b.hp*m*lm),spd=Math.floor(b.spd*(1+.008*(ps.level-1))),cr=8+r*2,cd=150+r*5,cres=4+r,cdef=5+r*2,pre=100+r*5,eva=95+r*3,res=25+r*5;for(let s of Object.keys(ps.gear)){let e=findGear(ps.gear[s]);if(!e)continue;let w=gearPower(e.item,ps.equipLv[s]||1);atk+=w.atk;def+=w.def;for(let a of e.copy.aff||[]){if(a.k==='ATK%')atk=Math.floor(atk*(1+a.v/100));if(a.k==='DEF%')def=Math.floor(def*(1+a.v/100));if(a.k==='HP%')hp=Math.floor(hp*(1+a.v/100));if(a.k==='SPD')spd+=Math.floor(a.v);if(a.k==='Crit Rate')cr+=a.v;if(a.k==='Crit DMG')cd+=a.v;if(a.k==='Crit Resistance')cres+=a.v;if(a.k==='Crit Defense')cdef+=a.v;if(a.k==='Precision')pre+=a.v;if(a.k==='Evasion')eva+=a.v;if(a.k==='Resistance')res+=a.v}}return{...b,rarity:o.rarity,level:ps.level,atk,def,hp,spd,critRate:cr,critDamage:cd,critResistance:cres,critDefense:cdef,precision:pre,evasion:eva,resistance:res}}

 save();topbar();commandRender();
}
function commandPreview(){if(!S.command)return[];let c=commandAlive().map(x=>({...x})),out=[];for(let k=0;k<8;k++){let bt=Infinity,b=null;for(let u of c){let t=(1000-u.g)/Math.max(1,u.es||effSpd(u.spd));if(t<bt){bt=t;b=u}}for(let u of c)u.g+=(u.es||effSpd(u.spd))*bt;b.g-=1000;out.push(b)}return out}
function commandMarkup(){
 let c=S.command,e=commandEnemy(),a=commandActor(),tl=commandPreview(),hs=c.units.filter(u=>u.type==='hero');
 return `<div class="timeline">${tl.map((u,i)=>`<div class="turn ${i===0?'now':''}">${u.icon}<br>${u.spd}</div>`).join('')}</div>
 <div class="card enemy"><div class="sprite">${e.icon}</div><h3>${e.name}</h3><div class="progress hp"><i style="width:${Math.max(0,e.hp/e.max*100)}%"></i></div><div class="tiny">${Math.floor(e.hp)}/${e.max} HP • DEF ${e.def} • SPD ${e.spd}</div>${statusHTML(e)}</div>
 <div class="partyBattle">${hs.map(u=>`<div class="unit ${u.hp<=0?'ko':''}"><b>${u.icon} ${u.name}</b><div class="progress hp"><i style="width:${Math.max(0,u.hp/u.max*100)}%"></i></div><div class="progress res"><i style="width:${u.res}%"></i></div><div class="tiny">${u.hp}/${u.max} • ${u.resName} ${u.res}</div></div>`).join('')}</div>
 <div class="card"><div class="log">${c.log.map(x=>'› '+x).join('<br>')}</div>
 ${c.over?(c.result==='win'?`<div class="mut">Victory!</div>${lootHTML()}`:`<div class="fail">WOMP WOMP<br><span class="tiny">The enemy has requested a rematch immediately, for some reason.</span></div>`):
 a&&a.type==='hero'?`<div class="actions"><button class="btn" onclick="commandHeroAct('basic')">Attack</button><button class="btn" onclick="commandHeroAct('skill')">AUTO SKILL</button><button class="btn" onclick="commandHeroAct('defend')">Defend</button><button class="btn" ${ri(a.rarity)<4?'disabled':''} onclick="commandHeroAct('ult')">Ultimate</button></div>`:'<div class="tiny">Enemy acting...</div>'}</div>`;
}
function commandRender(){if(!S.command)return;if(S.command.context==='explore')renderExplore();else renderDungeons()}
function closeCommand(){S.command=null;save();commandRender()}
function exploreNodes(){return Array.from({length:10},(_,i)=>{let n=i+1,t=n===10?'Boss':n===5?'Mini':'Battle';return{n,type:t,done:S.explore.cleared>=n,locked:S.explore.cleared+1<n}})}
function partyAutoStats(){let stats=S.party.map((_,i)=>heroStats(i));return{atk:stats.reduce((a,s)=>a+s.atk,0),def:stats.reduce((a,s)=>a+s.def,0),hp:stats.reduce((a,s)=>a+s.hp,0),spd:stats.reduce((a,s)=>a+s.spd,0)}}
function runNode(n,type){if(type==='Battle'){let p=partyAutoStats(),enemyHP=180+n*75;S.autoBattle={node:n,enemyHP,max:enemyHP,partyHP:p.hp,maxParty:p.hp,enemyAtk:18+n*7,over:false};S.explore.watching=true;save();renderExplore()}else{makeCommandBattle('explore',n,type);renderExplore()}}
function setBattleSpeed(v){S.explore.speed=v;save();renderExplore()}
function autoTick(){let a=S.autoBattle;if(!a||a.over)return;let p=partyAutoStats();for(let k=0;k<S.explore.speed&&!a.over;k++){let dmg=Math.max(1,p.atk*.32+Math.random()*p.atk*.08);a.enemyHP=Math.max(0,a.enemyHP-dmg);if(a.enemyHP<=0){a.over=true;S.explore.cleared=Math.max(S.explore.cleared,a.node);let gg=250+a.node*60,gm=8+a.node,it=dropGear(a.node,'normal');S.gold+=gg;S.gems+=gm;rewardSummary(gg,gm,it);for(let i=0;i<5;i++)gainSlotXP(i,12+a.node*2);break}let inc=Math.max(1,a.enemyAtk-p.def*.035);a.partyHP=Math.max(0,a.partyHP-inc);if(a.partyHP<=0)a.over=true}save();topbar();renderExplore()}
function manualHit(kind){let m=S.manual;if(!m||m.over)return;let dmg=kind==='ult'?180:kind==='skill'?90:kind==='defend'?0:55;m.hp=Math.max(0,m.hp-dmg+Math.floor(Math.random()*15));if(m.hp<=0){m.over=true;S.explore.cleared=Math.max(S.explore.cleared,m.node);let gg=800+m.node*120,gm=40+m.node*5,it=dropGear(m.node,m.type==='Boss'?'boss':'mini');S.gold+=gg;S.gems+=gm;rewardSummary(gg,gm,it);save();topbar();renderExplore();return}m.player=Math.max(0,m.player-(kind==='defend'?6:14+Math.floor(Math.random()*8)));if(m.player<=0)m.over=true;save();renderExplore()}
function farmToggle(){S.explore.farming=!S.explore.farming;save();renderExplore()}
function towerFight(){makeCommandBattle('tower',S.tower.floor,'Boss');renderDungeons()}
function towerHit(kind){let t=S.towerFight;if(!t||t.over)return;let dmg=kind==='ult'?190:kind==='skill'?95:kind==='defend'?0:60;t.hp=Math.max(0,t.hp-dmg+Math.floor(Math.random()*15));if(t.hp<=0){t.over=true;S.tower.best=Math.max(S.tower.best,S.tower.floor);S.tower.floor++;let gm=50+S.tower.best*4,it=dropGear(Math.min(10,S.tower.best),'boss');S.gems+=gm;rewardSummary(0,gm,it);save();topbar();renderDungeons();return}t.player=Math.max(0,t.player-(kind==='defend'?7:14+Math.floor(Math.random()*10)));if(t.player<=0)t.over=true;save();renderDungeons()}



function abandonExploreBattle(){S.command=null;S.lootLog=[];save();renderExplore()}
function abandonTowerBattle(){S.command=null;S.lootLog=[];save();renderDungeons()}
function commandReturnMap(){S.command=null;S.lootLog=[];save();renderExplore()}
function commandLeaveTower(){S.command=null;S.lootLog=[];save();renderDungeons()}
function commandNextTower(){S.command=null;S.lootLog=[];save();towerFight()}

function renderExplore(){
 if(S.command&&S.command.context==='explore'){
  let c=S.command;
  E('explore').innerHTML=`<div class="card banner"><h2>${c.type} • Whisperwood ${c.node}</h2><div class="mut">Full party command battle • rarity, level, gear and SPD all apply.</div></div>${commandMarkup()}${c.over?'<button class="btn primary" style="width:100%" onclick="commandReturnMap()">RETURN TO MAP</button>':'<button class="btn" style="width:100%;margin-top:5px" onclick="abandonExploreBattle()">LEAVE BATTLE</button>'}`;
  return;
 }
 if(S.autoBattle&&S.explore.watching){
  let a=S.autoBattle;
  E('explore').innerHTML=`<div class="card banner"><h2>Auto Battle • Node ${a.node}</h2><div class="speedbar"><button class="btn" onclick="setBattleSpeed(1)">1×</button><button class="btn" onclick="setBattleSpeed(2)">2×</button><button class="btn" onclick="setBattleSpeed(4)">4×</button></div></div>
  <div class="card enemy"><div class="sprite">👺</div><div class="progress hp"><i style="width:${Math.max(0,a.enemyHP/a.max*100)}%"></i></div><div class="tiny">${Math.floor(a.enemyHP)}/${a.max} HP</div></div>
  <div class="card"><div class="progress hp"><i style="width:${Math.max(0,a.partyHP/a.maxParty*100)}%"></i></div><div class="tiny">Party HP ${Math.floor(a.partyHP)}/${a.maxParty}</div>
  ${a.over?(a.enemyHP<=0?`<div class="mut">Auto victory!</div>${lootHTML()}<button class="btn primary" style="width:100%;margin-top:6px" onclick="S.explore.watching=false;S.autoBattle=null;S.lootLog=[];save();renderExplore()">CONTINUE</button>`:`<div class="fail">WOMP WOMP<br><span class="tiny">The goblin would like to thank your equipment manager.</span></div><button class="btn" style="width:100%;margin-top:6px" onclick="S.explore.watching=false;S.autoBattle=null;S.lootLog=[];save();renderExplore()">BACK TO MAP</button>`):'<button class="btn primary" style="width:100%;margin-top:6px" onclick="autoTick()">ADVANCE AUTO</button>'}</div>`;
  return;
 }
 let nodes=exploreNodes();
 E('explore').innerHTML=`<div class="card banner"><h2>Whisperwood</h2><div class="mut">Auto normal fights use real party stats. Minibosses/bosses use full SPD command combat.</div></div>
 <div class="nodegrid">${nodes.map(n=>`<button class="node ${n.done?'done':''} ${n.type!=='Battle'?'boss':''} ${n.locked?'locked':''}" ${n.locked?'disabled':''} onclick="runNode(${n.n},'${n.type}')">${n.type==='Boss'?'👑':n.type==='Mini'?'🐺':'⚔️'}<br>${n.n}<br>${n.type}</button>`).join('')}</div>
 <div class="card grow"><div class="row"><button class="btn" onclick="farmToggle()">${S.explore.farming?'STOP FARM':'BACKGROUND FARM'}</button><button class="btn" disabled>SKIP • Power system later</button></div><div class="tiny" style="margin-top:5px">${S.explore.farming?'Farming highest cleared node in the background.':'Clear encounters to improve farming.'}</div></div>`;
}
function renderDungeons(){
 if(S.command&&S.command.context==='tower'){
  let c=S.command;
  if(c.over&&c.result==='win'&&S.tower.autoAdvance){
   setTimeout(()=>{if(S.tower.autoAdvance&&S.command?.over)commandNextTower()},4000);
  }
  let post='';
  if(c.over&&c.result==='win'){
   post=`<div class="tiny" style="margin:5px 0">${S.tower.autoAdvance?'Auto Advance: next floor in ~4 seconds. You can still leave.':''}</div><div class="row"><button class="btn primary" onclick="commandNextTower()">NEXT FLOOR</button><button class="btn" onclick="commandLeaveTower()">LEAVE TOWER</button></div>`;
  }else if(c.over){
   post=`<button class="btn" style="width:100%" onclick="commandLeaveTower()">LEAVE TOWER</button>`;
  }else{
   post=`<button class="btn" style="width:100%;margin-top:5px" onclick="abandonTowerBattle()">LEAVE BATTLE</button>`;
  }
  E('dungeons').innerHTML=`<div class="card banner"><h2>Trial Tower • Cleared ${S.tower.best}</h2><div class="mut">Full 5-hero SPD command battle. Unlimited attempts.</div></div>${commandMarkup()}${post}`;
  return;
 }
 E('dungeons').innerHTML=`<div class="card banner"><h2>Dungeon Hall</h2><div class="mut">Alternate progression and future event modes.</div></div>
 <div class="card modecard"><div class="ico">🗼</div><div style="flex:1"><b>Trial Tower</b><div class="tiny">Next floor ${S.tower.floor} • Best cleared ${S.tower.best}</div></div><button class="btn primary" onclick="towerFight()">ENTER NEXT FLOOR</button></div>
 <div class="card"><button class="btn" style="width:100%" onclick="toggleTowerAuto()">AUTO ADVANCE: ${S.tower.autoAdvance?'ON':'OFF'}</button><div class="tiny">Victories wait ~4 seconds, then launch the next floor automatically until defeat.</div></div>
 <div class="card modecard"><div class="ico">🕳️</div><div style="flex:1"><b>Aether Dungeon</b><div class="tiny">Unique dungeon mechanics arrive in a later content update.</div></div><button class="btn" onclick="alert('Dungeon content expands later.')">ENTER</button></div>
 <div class="card modecard lock"><div class="ico">⚡</div><div><b>Future</b><div class="tiny">Raids • Arena • Expeditions • Events</div></div></div>`;
}
function renderAethergate(){let t=S.gachaTab,g=gateState(t),k=sigilName(t),r=gateRates(t),nx=gateRates(t,Math.min(8,g.level+1)),res=t==='Heroes'?(S.heroGateResults||[]):(S.gateResults||[]),odds=RS.map((x,i)=>r[i]?`<span class="badge"><span class="rarity ${x}">${x}</span> ${r[i]}%</span>`:'').join(' '),diff=RS.map((x,i)=>nx[i]!==r[i]?`${x} ${r[i]}→${nx[i]}%`:'').filter(Boolean).join(' • '),cards=t==='Heroes'?res.map(o=>`<div class="gear"><div class="ico">${o.hero.icon}</div><div class="txt"><b>${o.hero.name}</b><br><span class="rarity ${o.hero.native}">${o.hero.native}</span><br>${o.newHero?'NEW HERO':'Duplicate → shards'}</div></div>`).join(''):res.map(x=>`<div class="gear"><div class="ico">${x.icon}</div><div class="txt"><b>${x.name}</b><br><span class="rarity ${x.rarity}">${x.rarity}</span> • ${x.slot}</div></div>`).join('');E('aethergate').innerHTML=`<div class="card banner"><h2>✦ ${t} Gate • Lv.${g.level}</h2><div class="mut">${SIGIL_ICON[k]} ${k} Sigil ×${S.sigils[k]||0} • God pity ${g.pity}/140</div><div style="line-height:1.8">${odds}</div><div class="progress"><i style="width:${g.level>=8?100:g.xp/gateNeed(g.level)*100}%"></i></div><div class="tiny">${g.level>=8?'MAX GATE':g.xp+'/'+gateNeed(g.level)+' Gate XP'}${g.level<8?'<br>Next: '+diff:''}</div></div><div class="filterbar">${['Heroes','Weapons','Armor','Accessories'].map(x=>`<button class="btn ${t===x?'primary':''}" onclick="setGachaTab('${x}')">${x}</button>`).join('')}</div><div class="card"><div class="tiny">Sigils never mix with gems • 10 Sigils = 11 pulls • bonus pull grants Gate XP</div><div class="row"><button class="btn" onclick="${t==='Heroes'?'summonHero':'gatePull'}(1)">1 PULL</button><button class="btn gold" onclick="${t==='Heroes'?'summonHero':'gatePull'}(10)">10+1 PULL</button></div></div><div class="card grow scroll">${cards||'<div class="mut">Ready.</div>'}</div>`}

function render(p){if(p==='home')renderHome();if(p==='heroes')renderHeroes();if(p==='explore')renderExplore();if(p==='dungeons')renderDungeons();if(p==='aethergate')renderAethergate()}
persistBootSave();
topbar();renderHome();renderHeroes();renderExplore();renderDungeons();renderAethergate();
setInterval(()=>{if(E('home').classList.contains('on'))renderHome()},1000);

// Aggressive double-tap zoom suppression without disabling intended single taps.
let lastTouchEnd=0;
document.addEventListener('touchend',function(e){const now=Date.now();if(now-lastTouchEnd<=320)e.preventDefault();lastTouchEnd=now},{passive:false});

document.addEventListener('touchmove',function(e){
 let el=e.target;
 while(el&&el!==document.body){
  if(el.classList?.contains('page')||el.classList?.contains('scroll')||el.closest?.('.modal .card'))return;
  el=el.parentElement;
 }
 e.preventDefault();
},{passive:false});

document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
</script>
</body></html>
